<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <!-- Brand Icon Badge -->
  <rect x="4" y="6" width="44" height="44" rx="12" fill="url(#brandGrad)" />
  
  <!-- Search + Compass Pin Icon Geometry -->
  <circle cx="23" cy="25" r="9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M30 32L37 39" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round"/>
  <circle cx="23" cy="25" r="3" fill="#60a5fa"/>
  <circle cx="23" cy="25" r="1.5" fill="#ffffff"/>

  <!-- Brand Typography -->
  <text x="58" y="32" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="currentColor" class="brand-text-main">
    Find<tspan fill="#3b82f6">It</tspan>
  </text>
  <text x="59" y="44" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" text-transform="uppercase" fill="#64748b" class="brand-text-sub">
    Campus Portal
  </text>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="brandGrad" x1="4" y1="6" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
</svg>
